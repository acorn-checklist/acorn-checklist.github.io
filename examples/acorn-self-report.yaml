    todo: null
  E3:
    title: Errors and corrections
    answer:
    - error: YAML read the answer option 'no' in item B3 as the boolean False
      caught_by: agent
      fix: 'Quoted the value and made the validator reject non-text options (PR #3)'
    - error: Python f-string syntax that only works on newer Python versions in the website generator
      caught_by: agent
      fix: Rewritten before the first build
    - error: Attempted an unnecessary force push when restarting a merged branch
      caught_by: test
      fix: Blocked by the automated permission check; a normal push was enough
    - error: Proposed the name TRACE before checking whether it was already used
      caught_by: human
      fix: Human asked for a check; agent found clashes and proposed ACORN
    - error: Marked 'why AI was used' and 'tool's terms checked' as partly covered on too strict a reading of the policies
      caught_by: human
      fix: Reclassified after the human questioned it
    - error: A JavaScript regular expression inside a Python template string produced invalid-escape warnings
      caught_by: agent
      fix: Rewritten before committing
    source: agent
    note: '''test'' here means the session''s automated safety check.'
    todo: null
