    - output: Scripts and website
      method: tests
      notes: Automated checks in CI on every push; agent screenshot checks; YK read the commits and diffs.
    - output: Publisher policy table (checklist/publisher-policies.yaml)
      method: rerun_independently
      notes: The human read all seven policies and agreed with the agent's assessments (2026-11-24).
    - output: Disclosure wording, Cite & disclose page and skill steps 5-6
      method: read_line_by_line
      notes: YK read the files and diffs; CI checks; agent tested the page in a headless browser.
    source: human
    note: null
    todo: null
